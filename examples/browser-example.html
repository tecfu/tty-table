<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/tty-table@7/dist/browser/tty-table.global.js"></script>
    <script type="module">
      import { AnsiUp } from "https://cdn.jsdelivr.net/npm/ansi_up@6/+esm"

      const Table = TtyTable.default

      let header = [
        {
          value: "item",
          headerColor: "cyan",
          color: "white",
          align: "left",
          width: 20
        },
        {
          value: "price",
          color: "red",
          width: 10,
          formatter: function (value) {
            var str = `$${value.toFixed(2)}`
            if(value > 5) {
              str = this.style(str, "green")
            }
            return str
          }
        },
        {
          alias: "Is organic?",
          value: "organic",
          width: 15,
          formatter: function (value) {
            if(value === "yes") {
              value = this.style(value, "bgGreen", "black")
            } else{
              value = this.style(value, "bgRed", "white")
            }
            return value
          }
        }
      ]

      // Example with arrays as rows
      const rows = [
        ["tallarin verde", 5.50, "yes"],
        ["aji de gallina", 4.50, "no"],
      ]

      const footer = [
        "TOTAL",
        function (cellValue, columnIndex, rowIndex, rowData) {
          let total = rowData.reduce((prev, curr) => {
            return prev + curr[1]
          }, 0)
          .toFixed(2)

          return `$${total}`
        },
        function (cellValue, columnIndex, rowIndex, rowData) {
          let total = rowData.reduce((prev, curr) => {
            return prev + ((curr[2] === "yes") ? 1 : 0)
          }, 0)
          return `${ (total / rowData.length * 100).toFixed(2) }%`
        }
      ]

      const options = {
        borderStyle: "solid",
        borderColor: "green",
        paddingBottom: 0,
        headerAlign: "center",
        align: "center",
        color: "white",
        truncate: "..."
      }

      let ANSI = Table(header, rows, footer, options).render()
      console.log(ANSI);

      var ansi_up = new AnsiUp;
      var html = ansi_up.ansi_to_html(ANSI);

      document.getElementById('example').innerHTML = html;
    </script>
  </head>
  <body>
    <h2>Source: examples/browser-example.html</h2>
    Loads the standalone browser bundle of the published package (tty-table@7) from a CDN, so no build step is required.
    <pre>
      <span id="example"></span>
    </pre>
  </body>
</html>
